hwdec=auto-safe

# Network
network-timeout=10
stream-lavf-o=reconnect=1,reconnect_delay_max=5

# Buffering
cache=auto
cache-pause=no
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=50MiB
demuxer-readahead-secs=20
demuxer-seekable-cache=yes

# Best quality up to 1080p; H.264+AAC preferred for hw decode compat
# Remove vcodec/acodec filters below if bandwidth is not a concern
ytdl-format=bestvideo[height<=1080][vcodec^=avc]+bestaudio[acodec^=mp4a]/bestvideo[height<=1080]+bestaudio/best[height<=1080]

# YouTube: skip HLS fetch saves ~1.8s warm start
ytdl-raw-options-append=extractor-args=youtube:skip=hls
